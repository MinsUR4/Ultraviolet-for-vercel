<script src="/uv/uv.config.js" defer></script>
<script src="/uv/uv.bundle.js" defer></script>
<script src="/register-sw.js" defer></script>
<script src="/search.js" defer></script>
<script src="/scripts/index.js" defer></script>
<script src="/scripts/bg.js" defer></script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Google</title>

<link rel="icon" href="https://t3.gstatic.com/faviconV2?client=SOCIAL&type=FAVICON&fallback_opts=TYPE,SIZE,URL&url=https://google.com&size=16">

<style>
  @import url("https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap");

  body {
    margin: 0;
    font-family: Roboto, sans-serif;
    background: #000;
    color: #fff;
    overflow: hidden;
  }

  .black {
    position: fixed;
    inset: 0;
    background: black;
    z-index: 999;
  }

  .loadimg {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 120px;
    z-index: 1000;
  }

  .searchbox {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 50%;
  }

  .search {
    width: 100%;
    padding: 18px;
    border-radius: 16px;
    border: 2px solid #fff;
    background: #111;
    color: #fff;
    text-align: center;
    font-size: 18px;
  }

  button {
    margin-top: 10px;
    padding: 12px 20px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
  }

  .par-container {
    position: fixed;
    inset: 0;
    pointer-events: none;
  }

  .par {
    position: absolute;
    width: 6px;
    height: 6px;
    background: white;
    border-radius: 50%;
    opacity: 0.5;
  }
</style>
</head>

<body>

<div id="black" class="black"></div>
<img id="loadimg" class="loadimg" src="your-logo.png" />

<h1 id="title1" style="text-align:center; margin-top:40px;">YourSri</h1>

<form class="searchbox" id="searchbox">
  <input id="searchengine" type="hidden" />
  <input id="search" class="search" placeholder="Search the web freely" />

  <center>
    <button type="submit">Surf the web</button>
    <button type="button" id="googleBtn">Google</button>
  </center>
</form>

<div class="par-container"></div>

<!-- ================= SCRIPTS ================= -->



<script>
/* ================= SAFE COOKIE ================= */
function getCookie(name) {
  const value = "; " + document.cookie;
  const parts = value.split("; " + name + "=");
  if (parts.length === 2) return parts.pop().split(";").shift();
}

/* ================= BASE64 QUERY ================= */
document.addEventListener("DOMContentLoaded", () => {
  const params = new URLSearchParams(location.search);
  const q = params.get("query");

  if (q) {
    try {
      const decoded = decodeURIComponent(escape(atob(q)));
      const input = document.getElementById("search");
      if (input) input.value = decoded;
    } catch (e) {}
  }
});

/* ================= GOOGLE BUTTON ================= */
document.getElementById("googleBtn").onclick = () => {
  document.getElementById("search").value = "https://www.google.com/search?q=";
};

/* ================= PARTICLES ================= */
const container = document.querySelector(".par-container");
for (let i = 0; i < 40; i++) {
  const p = document.createElement("div");
  p.className = "par";
  p.style.left = Math.random() * 100 + "vw";
  p.style.top = Math.random() * 100 + "vh";
  container.appendChild(p);
}

/* ================= SERVICE WORKER SAFE ================= */
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js").catch(() => {});
}

/* ================= FADER ================= */
function fade() {
  document.getElementById("black")?.remove();
  document.getElementById("loadimg")?.remove();
}
setTimeout(fade, 300);

/* ================= TITLE ================= */
document.title = "Google";
</script>

</body>
</html>
